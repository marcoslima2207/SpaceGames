{% extends 'base.html' %}

{% block title %}E-mail enviado{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="auth-card text-center">
        <h2>📧 E-mail enviado</h2>

        <p class="mt-3">
            Se existir uma conta com este endereço de e-mail,

        <a href="{% url 'login' %}" class="btn btn-sg mt-3">
            Voltar ao Login
        </a>
    </div>
</div>
{% endblock %}
