{% extends 'base.html' %}

{% block title %}Nova Senha{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="auth-card">

        <h2 class="mb-4 text-center">
            🔒 Definir Nova Senha
        </h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-sg w-100">
                Salvar Nova Senha
            </button>

        </form>

    </div>
</div>
{% endblock %}
