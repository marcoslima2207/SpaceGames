{% extends 'base.html' %}

{% block title %}Recuperar Senha{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-card">

        <h2 class="auth-title mb-4">
            Recuperar Senha
        </h2>

        <p class="text-muted">
            Informe seu e-mail para receber as instruções de recuperação.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-sg w-100">
                Enviar Link
            </button>
        </form>

    </div>
</div>
{% endblock %}
